# Deploys apps/web to GitHub Pages.
#
# BASE_PATH is set from the repository name because Pages serves project sites
# from /<repo>/. On Vercel, which serves from the root, vercel.json builds the
# same app with no BASE_PATH and it works unchanged.
#
# MANUAL ONLY, deliberately. `actions/configure-pages` fails on a repo where
# Pages has not been switched on, and Pages cannot be switched on from a
# workflow — it is a one-time setting under Settings → Pages → Source: GitHub
# Actions. A push trigger here therefore fails on every commit until somebody
# does that by hand, and emails about it each time.
#
# To use it: enable Pages as above, then run this workflow from the Actions tab.
# If you want it on every push after that, add:
#
#   push:
#     branches: [main]
#
# Nothing else in the repo depends on this file. Vercel deploys from
# vercel.json and does not need it.
name: pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
